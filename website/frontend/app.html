<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PineScript-Skill | Live IDE</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="style.css?v=1.0.2">
    
    <!-- Monaco Editor Styles -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css">
</head>
<body class="ide-layout">
    
    <!-- Left Activity Bar -->
    <div class="activity-bar">
        <a href="index.html" class="activity-icon active" title="Back to Home"><i class="ph ph-house"></i></a>
        <div class="activity-icon" title="Files"><i class="ph ph-files"></i></div>
        <div class="activity-icon" title="Search"><i class="ph ph-magnifying-glass"></i></div>
        <div class="activity-icon" title="Source Control"><i class="ph ph-git-branch"></i></div>
        <div class="activity-icon" title="Settings" style="margin-top: auto;"><i class="ph ph-gear"></i></div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
        
        <!-- Center Editor Area -->
        <div class="editor-area">
            <!-- Tabs -->
            <div class="editor-tabs">
                <div class="tab active"><i class="ph ph-file-code text-accent"></i> main.pine</div>
                <div class="tab-spacer"></div>
                <button id="btn-lint" class="btn-icon" title="Lint Code"><i class="ph ph-magic-wand text-accent"></i></button>
                <div class="loader-wrapper"><i class="ph ph-circle-notch ph-spin text-muted" id="loader" style="display:none;"></i></div>
            </div>
            
            <!-- Monaco Container -->
            <div id="monaco-editor"></div>
            
            <!-- Bottom Panel (Terminal) -->
            <div class="bottom-panel">
                <div class="panel-header">
                    <div class="panel-tab active">TERMINAL</div>
                    <div class="panel-tab">PROBLEMS</div>
                </div>
                <div id="console-output">
                    <span class="text-accent">PineScript-Skill v1.0.0</span>
                    <br><span class="text-muted">Type code in the editor and click the magic wand icon to lint.</span>
                </div>
            </div>
        </div>

        <!-- Right Sidebar (AI Chat) -->
        <div class="chat-sidebar">
            <div class="chat-header">
                <div class="ai-branding">
                    <i class="ph ph-robot text-accent"></i>
                    <span>Ollama AI</span>
                </div>
                <select id="model-select" class="model-select" title="Select Local Model">
                    <option value="llama3.1">llama3.1 (default)</option>
                </select>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="message ai">
                    Hello! I'm connected to the PineScript-Skill rules. I can help you write, debug, and understand Pine Script v6.
                </div>
            </div>
            
            <div class="chat-input-area">
                <textarea id="chat-input" placeholder="Ask AI to generate or explain code..." rows="2"></textarea>
                <button id="btn-send" class="btn-send" title="Send Request"><i class="ph ph-paper-plane-right"></i></button>
            </div>
        </div>
        
    </div>
    
    <!-- Modal for Explanations -->
    <div id="explanation-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Rule Explanation</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <pre id="modal-text"></pre>
            </div>
        </div>
    </div>

    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script src="app.js?v=1.0.2"></script>
</body>
</html>
