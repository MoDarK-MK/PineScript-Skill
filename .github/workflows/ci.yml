name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile scripts
        run: python -m compileall scripts/
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  pine-lint:
    name: Lint Pine templates & snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint every source .pine file in the repo
        shell: bash
        run: |
          set -euo pipefail
          # release/ is excluded on purpose: those bundles are generated by
          # generate_release_bundle.py and are gitignored, so they exist only in
          # a working tree. Linting them locally but not in CI made the two
          # disagree; this prunes them so both check exactly the sources.
          status=0
          while IFS= read -r -d '' f; do
            echo "==> $f"
            python scripts/pine_lint.py "$f" --strict || status=1
          done < <(find assets references indicators strategies \
                        -type d -name release -prune -o -name '*.pine' -print0)
          exit $status
